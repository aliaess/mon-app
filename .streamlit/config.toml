[theme]
base = "light"
primaryColor = "#1B4F8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[browser]
gatherUsageStats = false

[global]
# L'application préremplit légitimement certains champs (chargement d'un exemple,
# réinitialisation) : on désactive l'avertissement correspondant.
disableWidgetStateDuplicationWarning = true

[server]
runOnSave = true
